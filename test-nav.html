<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导航跳转测试</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    nav { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 20px; z-index: 1000; }
    nav a { margin-right: 20px; text-decoration: none; color: #333; }
    section { min-height: 100vh; padding: 100px 20px 60px; }
    #brand { background: #fff; }
    #3d { background: #f5f5f7; }
    #mg { background: #fff; }
    #contact { background: #f5f5f7; }
    h2 { font-size: 32px; margin-bottom: 40px; }
  </style>
</head>
<body>
  <nav>
    <a href="#brand">品牌宣传片</a>
    <a href="#3d">三维动画</a>
    <a href="#mg">MG 动画</a>
    <a href="#contact">联系</a>
  </nav>

  <section id="brand">
    <h2>品牌宣传片</h2>
    <p>这是品牌宣传片区域</p>
  </section>

  <section id="3d">
    <h2>三维动画</h2>
    <p>这是三维动画区域</p>
  </section>

  <section id="mg">
    <h2>MG 动画</h2>
    <p>这是 MG 动画区域</p>
  </section>

  <section id="contact">
    <h2>联系</h2>
    <p>这是联系区域</p>
  </section>

  <script>
    console.log('=== 导航脚本开始加载 ===');
    
    document.querySelectorAll('a[href^="#"]').forEach((anchor, index) => {
      console.log(`注册链接 ${index}: ${anchor.getAttribute('href')}`);
      
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        console.log(`点击了：${targetId}`);
        
        const target = document.querySelector(targetId);
        if (target) {
          console.log(`找到目标元素：${target.id}, offsetTop: ${target.offsetTop}`);
          const offsetTop = target.offsetTop - 48;
          console.log(`滚动到：${offsetTop}`);
          
          window.scrollTo({
            top: offsetTop,
            behavior: 'smooth'
          });
        } else {
          console.error(`未找到目标元素：${targetId}`);
        }
      });
    });
    
    console.log('=== 导航脚本加载完成 ===');
  </script>
</body>
</html>
