<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动画测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 20px;
    }
    
    .test-section {
      min-height: 100vh;
      padding: 50px 20px;
      background: #f5f5f7;
      margin-bottom: 20px;
    }
    
    /* 基础 fade-in-up 类 */
    .fade-in-up {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 800ms cubic-bezier(0.16, 1, 0.3, 1),
                  transform 800ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .fade-in-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* 测试元素 */
    .test-box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      margin: 20px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    
    p {
      font-size: 18px;
      color: #666;
    }
    
    .status {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #0071e3;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="status" id="status">Observer 初始化中...</div>
  
  <div class="test-section">
    <h1>向下滚动查看动画效果 ↓</h1>
    <p>这个页面测试 IntersectionObserver 是否正确触发 fade-in-up 动画</p>
  </div>
  
  <div class="test-section">
    <h2>测试区域 1 - 关于我风格</h2>
    <div class="test-box fade-in-up">
      <h3>测试卡片 1</h3>
      <p>这个卡片应该有淡入上浮动画</p>
    </div>
    <div class="test-box fade-in-up">
      <h3>测试卡片 2</h3>
      <p>这个卡片应该有淡入上浮动画（延迟）</p>
    </div>
    <div class="test-box fade-in-up">
      <h3>测试卡片 3</h3>
      <p>这个卡片应该有淡入上浮动画（延迟更多）</p>
    </div>
  </div>
  
  <div class="test-section">
    <h2>测试区域 2 - 文字动画</h2>
    <p class="fade-in-up" style="display: inline-block;">第一行文字</p><br>
    <p class="fade-in-up" style="display: inline-block;">第二行文字</p><br>
    <p class="fade-in-up" style="display: inline-block;">第三行文字</p>
  </div>
  
  <div class="test-section">
    <h2>测试区域 3 - 更多内容</h2>
    <div class="test-box fade-in-up">卡片 A</div>
    <div class="test-box fade-in-up">卡片 B</div>
    <div class="test-box fade-in-up">卡片 C</div>
    <div class="test-box fade-in-up">卡片 D</div>
    <div class="test-box fade-in-up">卡片 E</div>
  </div>
  
  <script>
    console.log('🔍 动画测试脚本启动');
    
    // 更新状态
    const statusEl = document.getElementById('status');
    
    // 创建 Observer
    const observer = new IntersectionObserver((entries) => {
      console.log('👀 Observer 触发，entries:', entries.length);
      
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          console.log('  ✅ 元素可见，添加 visible 类');
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, {
      rootMargin: '0px 0px -80px 0px',
      threshold: 0.01
    });
    
    // 监听所有 fade-in-up 元素
    const elements = document.querySelectorAll('.fade-in-up');
    console.log('📦 找到', elements.length, '个 .fade-in-up 元素');
    
    elements.forEach((el, i) => {
      observer.observe(el);
      console.log(`  👁️ 监听 #${i + 1}`);
    });
    
    statusEl.textContent = `✅ 已监听 ${elements.length} 个元素 - 滚动查看效果`;
    
    console.log('✅ 动画测试初始化完成');
  </script>
</body>
</html>
